[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.4.0"
description = "Generate technical documentation (PDF, Word, Markdown) by scanning a repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Agis R Herdiana", email = "agis.rahma.herdiana@gmail.com"}]
keywords = ["documentation", "static-analysis", "cli", "pdf", "docx"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13",
    "questionary>=2",
    "keyring>=24",
]

[project.urls]
Repository = "https://github.com/agisrh/repolens"
Changelog = "https://github.com/agisrh/repolens/blob/main/CHANGELOG.md"

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools.packages.find]
include = ["repolens*"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: real repositories pinned to a commit (needs network for public repos, local clones for internal ones)"]
addopts = "-m 'not corpus'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: likely bugs, UP: modern syntax, SIM: simpler code
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# SIM905: "a b c".split() is kept on purpose for long lists of short tokens.
ignore = ["SIM905"]
